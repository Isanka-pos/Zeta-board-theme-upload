name: Build Zeta Board APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace -PverCode=${{ github.run_number }} -PgithubRepo=${{ github.repository }} -PstickerKey="${{ secrets.STICKER_KEY }}" -PwallpaperUrl="${{ vars.WALLPAPER_URL }}" -PemojimixKey="${{ secrets.EMOJIMIX_KEY }}"
      - name: Publish release (used by in-app updater)
        env:
          GH_TOKEN: ${{ github.token }}
          VC: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ZetaBoard.apk
          python3 - <<'PY'
          import json, os
          vc = int(os.environ["VC"])
          repo = os.environ["REPO"]
          notes = open("CHANGELOG.txt", encoding="utf-8").read().strip()
          data = {
              "versionCode": vc,
              "versionName": "1.0." + str(vc),
              "notes": notes,
              "apkUrl": "https://github.com/" + repo + "/releases/download/v" + str(vc) + "/ZetaBoard.apk",
          }
          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False)
          PY
          { cat .github/INSTALL_HELP.md; echo "## What's new"; echo; cat CHANGELOG.txt; } > release_notes.md
          # small update files (delta patches) so phones do not have to download the whole APK again
          sudo apt-get install -y bsdiff > /dev/null || echo "bsdiff not installed"
          python3 .github/scripts/make_patches.py || echo "patch step failed - publishing the full APK only"
          shopt -s nullglob
          PATCHES=(ZetaBoard-from-*.zdp)
          gh release create "v$VC" ZetaBoard.apk update.json "${PATCHES[@]}" --title "Zeta Board 1.0.$VC" --notes-file release_notes.md --target "$GITHUB_SHA"
      - name: Send push notification to all users
        # add [silent] to the commit message to publish a version without notifying everyone
        if: ${{ !contains(github.event.head_commit.message, '[silent]') }}
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          pip install --quiet google-auth requests
          python3 .github/scripts/send_push.py
      - uses: actions/upload-artifact@v4
        with:
          name: ZetaBoard-APK
          path: ZetaBoard.apk
