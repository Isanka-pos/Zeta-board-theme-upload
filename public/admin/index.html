<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zeta Wallpaper Admin</title>
<style>
:root{color-scheme:dark}
body{font-family:system-ui,sans-serif;background:#0b0b0d;color:#eee;max-width:720px;margin:0 auto;padding:16px}
h1{font-size:20px}
input,button,select{font:inherit;padding:10px;border-radius:8px;border:1px solid #333;background:#17171b;color:#eee;margin:4px 0;width:100%;box-sizing:border-box}
button{background:#6d5df6;border:0;font-weight:600}
button.del{background:#b3261e;width:auto;padding:4px 10px;font-size:13px}
.card{background:#121216;border:1px solid #26262c;border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.grid img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:8px;background:#222}
.s{font-size:12px;color:#aaa;word-break:break-all}
#log{white-space:pre-wrap;font-size:13px;color:#9be59b}
</style></head><body>
<h1>Zeta Wallpaper Admin</h1>
<div class="card">
  <input id="pw" type="password" placeholder="Admin password">
  <input id="cat" list="cats" placeholder="Category (e.g. Nature)">
  <datalist id="cats"></datalist>
  <input id="files" type="file" accept="image/*" multiple>
  <button id="go">Upload</button>
  <div id="log"></div>
  <div class="s">After uploading, the new wallpapers show in the app after about a minute (the site redeploys).</div>
</div>
<div class="card"><b>Current wallpapers</b><div id="list" class="grid" style="margin-top:10px"></div></div>
<script>
const $=s=>document.querySelector(s), log=m=>{$("#log").textContent+=m+"\n"};
$("#pw").value=sessionStorage.getItem("zpw")||"";
async function load(){
  try{
    const j=await (await fetch("/api/wallpapers",{cache:"no-store"})).json();
    const cats=[...new Set(j.items.map(i=>i.category))];
    $("#cats").innerHTML=cats.map(c=>`<option value="${c}">`).join("");
    $("#list").innerHTML=j.items.map(i=>`<div><img loading="lazy" src="${i.thumb}"><div class="s">${i.category} / ${i.name}</div><button class="del" data-c="${i.category}" data-i="${i.id}">Delete</button></div>`).join("")||"<div class='s'>None yet</div>";
  }catch(e){$("#list").textContent="Could not load list"}
}
function toB64(canvas,q){return canvas.toDataURL("image/jpeg",q).split(",")[1]}
function render(img,max){
  const r=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement("canvas");c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c;
}
function loadImg(f){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=u})}
async function post(url,body){
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({error:"Bad response"}));
  if(!r.ok)throw new Error(j.error||r.status);return j;
}
$("#go").onclick=async()=>{
  const pw=$("#pw").value,cat=$("#cat").value.trim(),files=[...$("#files").files];
  if(!pw||!cat||!files.length){log("Enter password, category and pick pictures");return}
  sessionStorage.setItem("zpw",pw);$("#go").disabled=true;
  for(const f of files){
    try{
      log("Uploading "+f.name+" ...");
      const img=await loadImg(f);
      let q=.88,full=toB64(render(img,2400),q);
      while(full.length>3.2e6&&q>.5){q-=.1;full=toB64(render(img,2400),q)}
      const thumb=toB64(render(img,480),.8);
      await post("/api/upload",{password:pw,category:cat,name:f.name.replace(/\.[^.]+$/,""),full,thumb});
      log("OK "+f.name);
    }catch(e){log("FAILED "+f.name+": "+e.message)}
  }
  $("#go").disabled=false;log("Done. Wait about a minute, then refresh.");
};
$("#list").onclick=async e=>{
  const b=e.target.closest("button.del");if(!b)return;
  const pw=$("#pw").value;if(!pw){log("Enter password");return}
  if(!confirm("Delete this wallpaper?"))return;
  try{await post("/api/delete",{password:pw,category:b.dataset.c,id:b.dataset.i});log("Deleted. Refresh in about a minute.");b.closest("div").remove()}
  catch(err){log("FAILED: "+err.message)}
};
load();
</script></body></html>
